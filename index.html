<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kho áo của Chía 💗</title>
  <link rel="icon" href="avatar.jpg" type="image/jpeg">

  <link rel="preconnect" href="https://llijmkoztqthovvklamm.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 12px 90px;
      background: linear-gradient(-45deg, #050507, #fe2c55, #121216, #22222a, #000000);
      background-size: 400% 400%;
      animation: redWhiteBlackGradient 10s ease infinite;
      overflow-x: hidden;
      color: #ffffff;
    }

    @keyframes redWhiteBlackGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Container co giãn linh hoạt theo màn hình */
    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    @media (min-width: 768px) {
      .container { max-width: 820px; }
      body { padding: 30px 20px 80px; }
    }
    @media (min-width: 1100px) {
      .container { max-width: 1100px; }
    }

    .nav-bar {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card-border-wrapper {
      position: relative;
      width: 100%;
      border-radius: 28px;
      padding: 3px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9),
                  0 0 25px rgba(254, 44, 85, 0.35);
      background: #111;
    }

    .card-border-wrapper::before {
      content: "";
      position: absolute;
      width: 300%;
      height: 300%;
      background: conic-gradient(from 0deg, #fe2c55, #ffffff, #00f0ff, #fe2c55);
      animation: spin 5s linear infinite;
      z-index: 1;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .card {
      position: relative;
      width: 100%;
      background: rgba(14, 14, 18, 0.95);
      border-radius: 25px;
      padding: 22px 14px;
      z-index: 2;
    }

    @media (min-width: 768px) {
      .card { padding: 28px 24px; }
    }

    .vault-search-box {
      width: 100%;
      position: relative;
      margin-bottom: 12px;
    }

    .vault-search-box input {
      width: 100%;
      padding: 11px 40px 11px 40px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(254, 44, 85, 0.4);
      border-radius: 12px;
      color: #fff;
      font-size: 0.92rem;
      outline: none;
      transition: all 0.2s;
    }

    .vault-search-box input:focus {
      border-color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.35);
    }

    .vault-search-box i.search-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #fe2c55;
    }

    .search-clear-btn {
      display: none;
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      color: #ccc;
      font-size: 0.75rem;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Chips lọc giá */
    .filter-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 18px;
      scrollbar-width: none;
    }
    .filter-chips::-webkit-scrollbar { display: none; }

    @media (min-width: 768px) {
      .filter-chips { justify-content: center; }
    }

    .chip-btn {
      flex: 0 0 auto;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #ddd;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip-btn.active {
      background: #fe2c55;
      border-color: #fe2c55;
      color: #fff;
      box-shadow: 0 0 10px rgba(254, 44, 85, 0.5);
    }

    /* Grid chia theo kích cỡ màn hình */
    .vault-grid, .skeleton-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 480px) {
      .vault-grid, .skeleton-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 768px) {
      .vault-grid, .skeleton-grid { grid-template-columns: repeat(3, 1fr); gap: 16px; }
    }
    @media (min-width: 1024px) {
      .vault-grid, .skeleton-grid { grid-template-columns: repeat(4, 1fr); gap: 18px; }
    }

    .vault-card {
      background: rgba(16, 16, 24, 0.95);
      border: 1.5px solid rgba(254, 44, 85, 0.35);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.75);
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .vault-card:hover {
      border-color: #00f0ff;
      transform: translateY(-3px);
    }

    .vault-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 4.8;
      background: #09090c;
      overflow: hidden;
      cursor: pointer;
    }

    .vault-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .vault-card:hover .vault-img {
      transform: scale(1.04);
    }

    .vault-price-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #fcee0a;
      color: #fcee0a;
      font-size: 0.82rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(252, 238, 10, 0.3);
    }

    .vault-card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.3);
      flex: 1;
      justify-content: space-between;
    }

    .vault-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .vault-code {
      font-size: 1rem;
      font-weight: 800;
      color: #fe2c55;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

      background: rgba(255, 255, 255, 0.08);
      border:
