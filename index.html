<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kho áo của Chía 💗</title>
  <link rel="icon" href="avatar.jpg" type="image/jpeg">

  <link rel="preconnect" href="https://llijmkoztqthovvklamm.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 12px 40px;
      background: linear-gradient(-45deg, #050507, #fe2c55, #121216, #ffffff, #000000);
      background-size: 400% 400%;
      animation: redWhiteBlackGradient 10s ease infinite;
      overflow-x: hidden;
      color: #ffffff;
    }

    @keyframes redWhiteBlackGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    .nav-bar {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card-border-wrapper {
      position: relative;
      width: 100%;
      border-radius: 28px;
      padding: 3px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9),
                  0 0 25px rgba(254, 44, 85, 0.3),
                  0 0 15px rgba(255, 255, 255, 0.2);
    }

    .card-border-wrapper::before {
      content: "";
      position: absolute;
      width: 170%;
      height: 170%;
      background: conic-gradient(#fe2c55, #ffffff, #111111, #fe2c55);
      animation: spin 5s linear infinite;
      will-change: transform;
      z-index: 0;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .card {
      position: relative;
      width: 100%;
      background: linear-gradient(rgba(10, 10, 14, 0.88), rgba(10, 10, 14, 0.94)), 
                  url('bg-profile.jpg') center/cover no-repeat;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 26px;
      padding: 22px 14px;
      z-index: 1;
    }

    /* Search & Filter Bar */
    .vault-search-box {
      width: 100%;
      position: relative;
      margin-bottom: 10px;
    }

    .vault-search-box input {
      width: 100%;
      padding: 10px 14px 10px 38px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(254, 44, 85, 0.4);
      border-radius: 12px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: all 0.2s;
    }

    .vault-search-box input:focus {
      border-color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.35);
    }

    .vault-search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #fe2c55;
    }

    /* Dải chip lọc giá vuốt ngang */
    .filter-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .filter-chips::-webkit-scrollbar {
      display: none;
    }

    .chip-btn {
      flex: 0 0 auto;
      padding: 6px 12px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #ddd;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip-btn.active {
      background: #fe2c55;
      border-color: #fe2c55;
      color: #fff;
      box-shadow: 0 0 10px rgba(254, 44, 85, 0.5);
    }

    /* Grid Layout */
    .vault-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 480px) {
      .vault-grid { grid-template-columns: 1fr 1fr; }
    }

    /* Card Item (Tối ưu hierarchy & tỷ lệ ảnh 4:5) */
    .vault-card {
      background: rgba(16, 16, 24, 0.95);
      border: 1.5px solid rgba(254, 44, 85, 0.35);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.75);
      transition: transform 0.2s ease, border-color 0.2s ease;
      display: flex;
      flex-direction: column;
    }

    .vault-card:hover {
      border-color: #00f0ff;
      transform: translateY(-2px);
    }

    .vault-img-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 4.8;
      background: #09090c;
      overflow: hidden;
      cursor: pointer;
    }

    .vault-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .vault-card:hover .vault-img {
      transform: scale(1.04);
    }

    .vault-price-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #fcee0a;
      color: #fcee0a;
      font-size: 0.82rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(252, 238, 10, 0.3);
    }

    .vault-card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.3);
    }

    .vault-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .vault-code {
      font-size: 1rem;
      font-weight: 800;
      color: #fe2c55;
      letter-spacing: 0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-icon-copy {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ddd;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .btn-icon-copy:active {
      transform: scale(0.9);
      background: #fe2c55;
      border-color: #fe2c55;
      color: #fff;
    }

    .btn-buy-acc {
      width: 100%;
      padding: 9px 12px;
      background: linear-gradient(135deg, #fe2c55, #ff0055);
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 4px 14px rgba(254, 44, 85, 0.4);
      transition: all 0.2s;
    }

    .btn-buy-acc:active {
      transform: scale(0.97);
    }

    /* Skeleton Loading UI */
    .skeleton-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }
    @media (min-width: 480px) {
      .skeleton-grid { grid-template-columns: 1fr 1fr; }
    }

    .skeleton-card {
      background: rgba(20, 20, 30, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      overflow: hidden;
    }

    .skeleton-img {
      width: 100%;
      aspect-ratio: 4 / 4.8;
      background: linear-gradient(90deg, #181824 25%, #252538 50%, #181824 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    .skeleton-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .skeleton-line {
      height: 16px;
      border-radius: 4px;
      background: linear-gradient(90deg, #181824 25%, #252538 50%, #181824 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    .skeleton-btn {
      height: 34px;
      border-radius: 8px;
      background: linear-gradient(90deg, #181824 25%, #252538 50%, #181824 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
    }

    @keyframes shimmer {
      0% { background-position: -200% 0; }
      100% { background-position: 200% 0; }
    }

    /* Empty State */
    .vault-empty {
      text-align: center;
      padding: 30px 10px;
      color: #999;
      font-size: 0.88rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .empty-actions {
      display: flex;
      gap: 8px;
      margin-top: 6px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn-empty-action {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.78rem;
      cursor: pointer;
    }

    /* Modal phóng to ảnh */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-overlay.active { display: flex; }

    .image-modal-content {
      max-width: 95vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 10px;
      border: 1px solid rgba(254, 44, 85, 0.4);
    }

    .image-modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      color: #fff;
      font-size: 32px;
      cursor: pointer;
    }

    /* Toast */
    .toast-msg {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(18, 18, 24, 0.95);
      border: 1px solid #00f0ff;
      color: #fff;
      padding: 9px 18px;
      border-radius: 24px;
      font-size: 0.85rem;
      box-shadow: 0 8px 25px rgba(0, 240, 255, 0.35);
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.25s ease;
      white-space: nowrap;
    }

    .toast-msg.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="nav-bar">
      <span style="font-size: 0.95rem; color: #00f0ff; font-weight: 700;">
        <i class="fa-solid fa-shirt"></i> Kho áo của Chía 💗
      </span>
    </div>

    <div class="card-border-wrapper">
      <main class="card">
        <header style="text-align: center; margin-bottom: 14px;">
          <h1 style="font-size: 1.25rem; font-weight: 800; color: #00f0ff; text-shadow: 0 0 10px rgba(0,240,255,0.4);">
            <i class="fa-solid fa-shirt"></i> DANH SÁCH ACC CÓ SẴN
          </h1>
          <p style="font-size: 0.8rem; color: #bbb; margin-top: 4px;">
            Nhấn <strong>"MUA ACC NÀY"</strong> để copy thông tin và nhắn TikTok cho tui nhé 💗
          </p>
        </header>

        <!-- Search Input -->
        <div class="vault-search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="vaultSearchInput" placeholder="Tìm kiếm theo mã tài khoản (#xxxxx)..." autocomplete="off">
        </div>

        <!-- Filter Chips Bar -->
        <div class="filter-chips">
          <button class="chip-btn active" data-filter="all">Tất cả</button>
          <button class="chip-btn" data-filter="under100">Dưới 100k</button>
          <button class="chip-btn" data-filter="100to300">100k - 300k</button>
          <button class="chip-btn" data-filter="over300">Trên 300k</button>
          <button class="chip-btn" data-filter="sortAsc">Giá rẻ trước</button>
        </div>

        <!-- Skeleton Loading Placeholders -->
        <div id="vaultSkeleton" class="skeleton-grid">
          <div class="skeleton-card">
            <div class="skeleton-img"></div>
            <div class="skeleton-body">
              <div class="skeleton-line" style="width: 60%;"></div>
              <div class="skeleton-btn"></div>
            </div>
          </div>
          <div class="skeleton-card">
            <div class="skeleton-img"></div>
            <div class="skeleton-body">
              <div class="skeleton-line" style="width: 50%;"></div>
              <div class="skeleton-btn"></div>
            </div>
          </div>
        </div>

        <!-- Product Grid -->
        <div id="vaultGrid" class="vault-grid" style="display: none;"></div>

        <!-- Empty State -->
        <div id="vaultEmpty" class="vault-empty" style="display: none;">
          <i class="fa-solid fa-box-open" style="font-size: 2rem; color: #555;"></i>
          <p>Không tìm thấy tài khoản nào khớp yêu cầu!</p>
          <div class="empty-actions">
            <button class="btn-empty-action" onclick="resetFilters()">
              <i class="fa-solid fa-rotate-left"></i> Xóa bộ lọc
            </button>
            <button class="btn-empty-action" onclick="contactCustomRequest()" style="background:#fe2c55; border-color:#fe2c55;">
              <i class="fa-brands fa-tiktok"></i> Nhắn tìm acc theo ý
            </button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal phóng to ảnh -->
  <div id="imageModal" class="modal-overlay" onclick="closeImageModal()">
    <span class="image-modal-close" onclick="closeImageModal()">&times;</span>
    <img class="image-modal-content" id="modalImg" alt="Xem ảnh phóng to" onclick="event.stopPropagation()">
  </div>

  <!-- Toast Noti -->
  <div id="toast" class="toast-msg"></div>

  <script>
    const SUPABASE_URL = 'https://llijmkoztqthovvklamm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxsaWpta296dHF0aG92dmtsYW1tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NDQ1NzksImV4cCI6MjEwNjQyMDU3OX0.6ZyBSLuXhQNC-nm1nCBTEZMs5Y3FDE83xD8lvL0HRUk';
    const TIKTOK_PROFILE = 'https://www.tiktok.com/@phalnnn';

    let _supabase = null;
    let vaultAccounts = [];
    let currentFilter = 'all';
    let searchQuery = '';
    let searchDebounceTimer = null;

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2200);
    }

    async function initSupabase() {
      if (window.supabase) {
        _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        await fetchVaultAccounts();
      } else {
        setTimeout(initSupabase, 80);
      }
    }

    async function fetchVaultAccounts() {
      const skeletonEl = document.getElementById('vaultSkeleton');

      try {
        const { data, error } = await _supabase
          .from('accounts')
          .select('id, title, image, price')
          .eq('is_sold', false)
          .order('created_at', { ascending: false });

        if (error) throw error;

        vaultAccounts = (data || []).map(row => ({
          id: row.id,
          title: String(row.title || 'Chưa đặt tên'),
          image: row.image || '',
          price: parseFloat(row.price) || 0
        }));

        skeletonEl.style.display = 'none';
        applyFiltersAndRender();
      } catch (err) {
        console.error("Lỗi Supabase:", err);
        skeletonEl.innerHTML = `<p style="color:#fe2c55; text-align:center; padding:20px 0;">Không thể tải dữ liệu. Vui lòng thử lại sau!</p>`;
      }
    }

    function formatPrice(num) {
      return num > 0 ? num.toLocaleString('vi-VN') + 'đ' : 'Liên hệ';
    }

    function applyFiltersAndRender() {
      let filtered = [...vaultAccounts];

      if (searchQuery) {
        filtered = filtered.filter(acc => acc.title.toLowerCase().includes(searchQuery));
      }

      if (currentFilter === 'under100') {
        filtered = filtered.filter(acc => acc.price > 0 && acc.price < 100000);
      } else if (currentFilter === '100to300') {
        filtered = filtered.filter(acc => acc.price >= 100000 && acc.price <= 300000);
      } else if (currentFilter === 'over300') {
        filtered = filtered.filter(acc => acc.price > 300000);
      } else if (currentFilter === 'sortAsc') {
        filtered.sort((a, b) => a.price - b.price);
      }

      renderVaultAccounts(filtered);
    }

    function renderVaultAccounts(list) {
      const gridEl = document.getElementById('vaultGrid');
      const emptyEl = document.getElementById('vaultEmpty');

      gridEl.replaceChildren();

      if (list.length === 0) {
        gridEl.style.display = 'none';
        emptyEl.style.display = 'flex';
        return;
      }

      emptyEl.style.display = 'none';
      gridEl.style.display = 'grid';

      const fragment = document.createDocumentFragment();

      list.forEach(acc => {
        const card = document.createElement('div');
        card.className = 'vault-card';

        const priceText = formatPrice(acc.price);

        // Khung ảnh 4:5
        const imgWrap = document.createElement('div');
        imgWrap.className = 'vault-img-wrap';

        if (acc.image) {
          const img = document.createElement('img');
          img.className = 'vault-img';
          img.src = acc.image;
          img.alt = acc.title;
          img.loading = 'lazy';
          img.onerror = () => {
            imgWrap.innerHTML = '<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#666;font-size:0.8rem;"><i class="fa-solid fa-image-slash"></i>&nbsp;Lỗi ảnh</div>';
          };
          imgWrap.appendChild(img);
          imgWrap.onclick = () => openZoomImage(acc.image);
        } else {
          imgWrap.innerHTML = `<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#666;font-size:0.8rem;"><i class="fa-solid fa-image"></i>&nbsp;Không có ảnh</div>`;
        }

        const badge = document.createElement('span');
        badge.className = 'vault-price-badge';
        badge.textContent = priceText;
        imgWrap.appendChild(badge);

        // Body card
        const body = document.createElement('div');
        body.className = 'vault-card-body';

        const titleRow = document.createElement('div');
        titleRow.className = 'vault-title-row';

        const titleEl = document.createElement('span');
        titleEl.className = 'vault-code';
        titleEl.textContent = acc.title;

        // Nút copy dạng icon tròn
        const copyBtn = document.createElement('button');
        copyBtn.className = 'btn-icon-copy';
        copyBtn.type = 'button';
        copyBtn.title = 'Copy mã tài khoản';
        copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i>';
        copyBtn.onclick = () => copyAccCode(acc.title, copyBtn);

        titleRow.append(titleEl, copyBtn);

        // Nút mua acc full-width
        const buyBtn = document.createElement('button');
        buyBtn.className = 'btn-buy-acc';
        buyBtn.type = 'button';
        buyBtn.innerHTML = '<i class="fa-brands fa-tiktok"></i> MUA ACC NÀY';
        buyBtn.onclick = () => selectAndOrderAccount(acc.title, priceText);

        body.append(titleRow, buyBtn);
        card.append(imgWrap, body);
        fragment.appendChild(card);
      });

      gridEl.appendChild(fragment);
    }

    // Lắng nghe sự kiện chip lọc
    document.querySelectorAll('.chip-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.chip-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        applyFiltersAndRender();
      });
    });

    // Tìm kiếm với Debounce
    document.getElementById('vaultSearchInput').addEventListener('input', (e) => {
      clearTimeout(searchDebounceTimer);
      searchDebounceTimer = setTimeout(() => {
        searchQuery = e.target.value.trim().toLowerCase();
        applyFiltersAndRender();
      }, 200);
    });

    function resetFilters() {
      searchQuery = '';
      document.getElementById('vaultSearchInput').value = '';
      currentFilter = 'all';
      document.querySelectorAll('.chip-btn').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
      applyFiltersAndRender();
    }

    function contactCustomRequest() {
      window.open(TIKTOK_PROFILE, '_blank', 'noopener,noreferrer');
    }

    async function writeClipboardText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }

    async function copyAccCode(code, btn) {
      try {
        await writeClipboardText(code);
        const original = btn.innerHTML;
        btn.innerHTML = `<i class="fa-solid fa-check" style="color:#00f0ff;"></i>`;
        showToast(`Đã chép mã: ${code}`);
        setTimeout(() => { btn.innerHTML = original; }, 1500);
      } catch (e) {
        showToast('Lỗi khi sao chép mã!');
      }
    }

    async function selectAndOrderAccount(accCode, accPrice) {
      const message = `🌸 YÊU CẦU MUA TÀI KHOẢN 🌸
- Mã tài khoản: ${accCode}
- Giá: ${accPrice}
- Kênh liên hệ: Kho áo của Chía (@phalnnn)
---------------------------
👉 Mình muốn mua tài khoản ${accCode} này, bạn kiểm tra giúp mình nhé 💗`;

      try {
        await writeClipboardText(message);
        showToast(`Đã copy nội dung ${accCode}! Đang chuyển sang TikTok...`);
      } catch (e) {
        showToast(`Mở TikTok để nhắn Chía mã ${accCode}`);
      }

      setTimeout(() => {
        window.open(TIKTOK_PROFILE, '_blank', 'noopener,noreferrer');
      }, 400);
    }

    function openZoomImage(src) {
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImg');
      modalImg.src = src;
      modal.classList.add('active');
    }

    function closeImageModal() {
      document.getElementById('imageModal').classList.remove('active');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === "Escape") closeImageModal();
    });

    window.addEventListener('DOMContentLoaded', initSupabase);
  </script>
</body>
</html>
