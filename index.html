<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kho áo của Chía 💗</title>
  <link rel="icon" href="avatar.jpg" type="image/jpeg">

  <!-- Preconnect CDN & Backend -->
  <link rel="preconnect" href="https://llijmkoztqthovvklamm.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <!-- Supabase Client JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 14px 40px;
      background: linear-gradient(-45deg, #050507, #fe2c55, #121216, #ffffff, #000000);
      background-size: 400% 400%;
      animation: bgShift 14s ease infinite;
      overflow-x: hidden;
      color: #ffffff;
    }

    @keyframes bgShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    .container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: center;
    }

    .nav-bar {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card-border-wrapper {
      position: relative;
      width: 100%;
      border-radius: 28px;
      padding: 3px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.85),
                  0 0 20px rgba(254, 44, 85, 0.25);
    }

    .card-border-wrapper::before {
      content: "";
      position: absolute;
      width: 180%;
      height: 180%;
      left: -40%;
      top: -40%;
      background: conic-gradient(#fe2c55, #ffffff, #111111, #fe2c55);
      animation: spin 6s linear infinite;
      will-change: transform;
      z-index: 0;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .card {
      position: relative;
      width: 100%;
      background: linear-gradient(rgba(10, 10, 14, 0.9), rgba(10, 10, 14, 0.95)), 
                  url('bg-profile.jpg') center/cover no-repeat;
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 25px;
      padding: 22px 16px;
      z-index: 1;
    }

    .vault-search-box {
      width: 100%;
      position: relative;
      margin-bottom: 14px;
    }

    .vault-search-box input {
      width: 100%;
      padding: 11px 14px 11px 38px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(254, 44, 85, 0.4);
      border-radius: 12px;
      color: #fff;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .vault-search-box input:focus {
      border-color: #00f0ff;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    .vault-search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #fe2c55;
    }

    .vault-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-top: 10px;
    }

    @media (min-width: 480px) {
      .vault-grid { grid-template-columns: 1fr 1fr; }
    }

    .vault-card {
      background: rgba(16, 16, 24, 0.95);
      border: 1.5px solid rgba(254, 44, 85, 0.35);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.7);
      transition: transform 0.25s ease, border-color 0.25s ease;
      display: flex;
      flex-direction: column;
    }

    .vault-card:hover {
      border-color: #00f0ff;
      transform: translateY(-3px);
    }

    .vault-img-wrap {
      position: relative;
      width: 100%;
      height: 180px;
      background: #09090c;
      overflow: hidden;
      cursor: pointer;
    }

    .vault-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease;
    }

    .vault-card:hover .vault-img {
      transform: scale(1.04);
    }

    .vault-tag {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.6);
      color: #00f0ff;
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .vault-price-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #fcee0a;
      color: #fcee0a;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .vault-card-body {
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.35);
    }

    .vault-card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .vault-code {
      font-size: 1rem;
      font-weight: 800;
      color: #fe2c55;
      letter-spacing: 0.5px;
    }

    .vault-price-display {
      font-size: 0.9rem;
      font-weight: 800;
      color: #fcee0a;
    }

    .btn-buy-acc {
      padding: 7px 12px;
      background: linear-gradient(135deg, #fe2c55, #ff0055);
      border: none;
      border-radius: 8px;
      color: #fff;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .btn-buy-acc:active {
      transform: scale(0.96);
    }

    .btn-copy-code {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #eee;
      font-size: 0.74rem;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s;
    }

    .btn-copy-code:hover {
      background: #fe2c55;
      border-color: #fe2c55;
    }

    .vault-status-box {
      text-align: center;
      padding: 35px 10px;
      font-size: 0.9rem;
      color: #aaa;
    }

    /* Modal phóng to */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }

    .modal-overlay.active { display: flex; }

    .image-modal-content {
      max-width: 95vw;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 8px;
      border: 1px solid rgba(254, 44, 85, 0.4);
    }

    .image-modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      color: #fff;
      font-size: 32px;
      cursor: pointer;
    }

    /* Toast Notification */
    .toast-msg {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(18, 18, 24, 0.95);
      border: 1px solid #00f0ff;
      color: #fff;
      padding: 10px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      box-shadow: 0 8px 25px rgba(0, 240, 255, 0.3);
      z-index: 10000;
      opacity: 0;
      pointer-events: none;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s ease;
      white-space: nowrap;
    }

    .toast-msg.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="nav-bar">
      <span style="font-size: 0.95rem; color: #00f0ff; font-weight: 700;">
        <i class="fa-solid fa-shirt"></i> Kho áo của Chía 💗
      </span>
    </div>

    <div class="card-border-wrapper">
      <main class="card">
        <header style="text-align: center; margin-bottom: 16px;">
          <h1 style="font-size: 1.25rem; font-weight: 800; color: #00f0ff;">
            <i class="fa-solid fa-shirt"></i> DANH SÁCH ACC CÓ SẴN
          </h1>
          <p style="font-size: 0.8rem; color: #bbb; margin-top: 5px;">
            Nhấn <strong>"MUA ACC NÀY"</strong> để sao chép thông tin và sang TikTok nhắn cho tui nhé!
          </p>
        </header>

        <div class="vault-search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="vaultSearchInput" placeholder="Tìm kiếm theo mã tài khoản (#xxxxx)..." autocomplete="off">
        </div>

        <div id="vaultLoading" class="vault-status-box">
          <i class="fa-solid fa-spinner fa-spin" style="font-size: 1.6rem; color: #fe2c55; margin-bottom: 8px;"></i>
          <p>Đang tải danh sách tài khoản...</p>
        </div>

        <div id="vaultGrid" class="vault-grid" style="display: none;"></div>

        <div id="vaultEmpty" class="vault-status-box" style="display: none;">
          <i class="fa-solid fa-box-open" style="font-size: 2rem; margin-bottom: 8px; color: #555;"></i>
          <p>Không tìm thấy tài khoản phù hợp!</p>
        </div>
      </main>
    </div>
  </div>

  <!-- Modal phóng to ảnh -->
  <div id="imageModal" class="modal-overlay" onclick="closeImageModal()">
    <span class="image-modal-close" onclick="closeImageModal()">&times;</span>
    <img class="image-modal-content" id="modalImg" alt="Xem ảnh phóng to" onclick="event.stopPropagation()">
  </div>

  <!-- Toast -->
  <div id="toast" class="toast-msg"></div>

  <script>
    const SUPABASE_URL = 'https://llijmkoztqthovvklamm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxsaWpta296dHF0aG92dmtsYW1tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NDQ1NzksImV4cCI6MjEwNjQyMDU3OX0.6ZyBSLuXhQNC-nm1nCBTEZMs5Y3FDE83xD8lvL0HRUk';
    const TIKTOK_PROFILE = 'https://www.tiktok.com/@phalnnn';

    let _supabase = null;
    let vaultAccounts = [];
    let searchDebounceTimer = null;

    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    async function initSupabase() {
      if (window.supabase) {
        _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        await fetchVaultAccounts();
      } else {
        setTimeout(initSupabase, 80);
      }
    }

    async function fetchVaultAccounts() {
      const loadingEl = document.getElementById('vaultLoading');
      const gridEl = document.getElementById('vaultGrid');
      const emptyEl = document.getElementById('vaultEmpty');

      try {
        const { data, error } = await _supabase
          .from('accounts')
          .select('id, title, image, price')
          .eq('is_sold', false)
          .order('created_at', { ascending: false });

        if (error) throw error;

        vaultAccounts = (data || []).map(row => ({
          id: row.id,
          title: String(row.title || 'Chưa đặt tên'),
          image: row.image || '',
          price: parseFloat(row.price) || 0
        }));

        loadingEl.style.display = 'none';
        renderVaultAccounts(vaultAccounts);
      } catch (err) {
        console.error("Lỗi Supabase:", err);
        loadingEl.innerHTML = `<p style="color:#fe2c55;">Lỗi kết nối kho tài khoản. Vui lòng tải lại trang!</p>`;
      }
    }

    function formatPrice(num) {
      return num > 0 ? num.toLocaleString('vi-VN') + 'đ' : 'Liên hệ';
    }

    function renderVaultAccounts(list) {
      const gridEl = document.getElementById('vaultGrid');
      const emptyEl = document.getElementById('vaultEmpty');

      gridEl.replaceChildren();

      if (list.length === 0) {
        gridEl.style.display = 'none';
        emptyEl.style.display = 'block';
        return;
      }

      emptyEl.style.display = 'none';
      gridEl.style.display = 'grid';

      const fragment = document.createDocumentFragment();

      list.forEach(acc => {
        const card = document.createElement('div');
        card.className = 'vault-card';

        const priceText = formatPrice(acc.price);

        // Phần ảnh
        const imgWrap = document.createElement('div');
        imgWrap.className = 'vault-img-wrap';

        if (acc.image) {
          const img = document.createElement('img');
          img.className = 'vault-img';
          img.src = acc.image;
          img.alt = acc.title;
          img.loading = 'lazy';
          img.onerror = () => {
            imgWrap.innerHTML = '<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#666;font-size:0.8rem;"><i class="fa-solid fa-image-slash"></i> Lỗi ảnh</div>';
          };
          imgWrap.appendChild(img);
          imgWrap.onclick = () => openZoomImage(acc.image);
        } else {
          imgWrap.innerHTML = `<div style="height:100%;display:flex;align-items:center;justify-content:center;color:#555;font-size:0.8rem;"><i class="fa-solid fa-image"></i>&nbsp;Không có ảnh</div>`;
        }

        const tag = document.createElement('span');
        tag.className = 'vault-tag';
        tag.textContent = 'VERIFIED';

        const badge = document.createElement('span');
        badge.className = 'vault-price-badge';
        badge.textContent = priceText;

        imgWrap.append(tag, badge);

        // Phần thông tin
        const body = document.createElement('div');
        body.className = 'vault-card-body';

        const rowTop = document.createElement('div');
        rowTop.className = 'vault-card-row';

        const titleEl = document.createElement('span');
        titleEl.className = 'vault-code';
        titleEl.textContent = acc.title;

        const priceDisplay = document.createElement('span');
        priceDisplay.className = 'vault-price-display';
        priceDisplay.textContent = priceText;

        rowTop.append(titleEl, priceDisplay);

        const rowBottom = document.createElement('div');
        rowBottom.className = 'vault-card-row';

        const copyBtn = document.createElement('button');
        copyBtn.className = 'btn-copy-code';
        copyBtn.type = 'button';
        copyBtn.innerHTML = '<i class="fa-regular fa-copy"></i> Copy mã';
        copyBtn.onclick = () => copyAccCode(acc.title, copyBtn);

        const buyBtn = document.createElement('button');
        buyBtn.className = 'btn-buy-acc';
        buyBtn.type = 'button';
        buyBtn.innerHTML = '<i class="fa-brands fa-tiktok"></i> MUA ACC NÀY';
        buyBtn.onclick = () => selectAndOrderAccount(acc.title, priceText);

        rowBottom.append(copyBtn, buyBtn);
        body.append(rowTop, rowBottom);
        card.append(imgWrap, body);

        fragment.appendChild(card);
      });

      gridEl.appendChild(fragment);
    }

    // Debounced search
    document.getElementById('vaultSearchInput').addEventListener('input', (e) => {
      clearTimeout(searchDebounceTimer);
      const query = e.target.value.trim().toLowerCase();
      searchDebounceTimer = setTimeout(() => {
        const filtered = vaultAccounts.filter(acc => acc.title.toLowerCase().includes(query));
        renderVaultAccounts(filtered);
      }, 200);
    });

    async function writeClipboardText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }

    async function copyAccCode(code, btn) {
      try {
        await writeClipboardText(code);
        const original = btn.innerHTML;
        btn.innerHTML = `<i class="fa-solid fa-check"></i> Đã chép!`;
        showToast(`Đã sao chép mã: ${code}`);
        setTimeout(() => { btn.innerHTML = original; }, 2000);
      } catch (e) {
        showToast('Không thể sao chép tự động!');
      }
    }

    async function selectAndOrderAccount(accCode, accPrice) {
      const message = `🌸 YÊU CẦU MUA TÀI KHOẢN 🌸
- Mã tài khoản: ${accCode}
- Giá: ${accPrice}
- Kênh liên hệ: Kho áo của Chía (@phalnnn)
---------------------------
👉 Mình muốn mua tài khoản ${accCode} này, bạn kiểm tra giúp mình nhé 💗`;

      try {
        await writeClipboardText(message);
        showToast(`Đã copy nội dung mua mã ${accCode}! Đang mở TikTok...`);
      } catch (e) {
        showToast(`Mở TikTok để liên hệ mua mã ${accCode}`);
      }

      setTimeout(() => {
        window.open(TIKTOK_PROFILE, '_blank', 'noopener,noreferrer');
      }, 400);
    }

    function openZoomImage(src) {
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImg');
      modalImg.src = src;
      modal.classList.add('active');
    }

    function closeImageModal() {
      document.getElementById('imageModal').classList.remove('active');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === "Escape") closeImageModal();
    });

    window.addEventListener('DOMContentLoaded', initSupabase);
  </script>
</body>
</html>
