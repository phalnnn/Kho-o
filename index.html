<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kho áo của Chía 💗</title>
  <link rel="icon" href="avatar.jpg" type="image/jpeg">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  
  <!-- Supabase Client JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 30px 14px 40px;
      background: linear-gradient(-45deg, #050507, #fe2c55, #121216, #ffffff, #000000);
      background-size: 400% 400%;
      animation: redWhiteBlackGradient 10s ease infinite;
      overflow-x: hidden;
      color: #ffffff;
    }

    @keyframes redWhiteBlackGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
    }

    .nav-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .btn-back-home {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #ffffff;
      background: rgba(16, 16, 22, 0.85);
      border: 1px solid rgba(254, 44, 85, 0.5);
      border-radius: 10px;
      padding: 7px 14px;
      font-size: 0.84rem;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s;
    }

    .btn-back-home:hover {
      background: #fe2c55;
      box-shadow: 0 0 12px rgba(254, 44, 85, 0.6);
      transform: translateX(-2px);
    }

    .card-border-wrapper {
      position: relative;
      width: 100%;
      border-radius: 30px;
      padding: 3px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9),
                  0 0 25px rgba(254, 44, 85, 0.3),
                  0 0 15px rgba(255, 255, 255, 0.2);
    }

    .card-border-wrapper::before {
      content: "";
      position: absolute;
      width: 160%;
      height: 160%;
      background: conic-gradient(#fe2c55, #ffffff, #111111, #fe2c55);
      animation: spin 5s linear infinite;
      z-index: 0;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .card {
      position: relative;
      width: 100%;
      background: linear-gradient(rgba(10, 10, 14, 0.85), rgba(10, 10, 14, 0.92)), 
                  url('bg-profile.jpg') center/cover no-repeat;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      padding: 26px 18px;
      color: #ffffff;
      z-index: 1;
    }

    .vault-search-box {
      width: 100%;
      position: relative;
      margin-bottom: 14px;
    }

    .vault-search-box input {
      width: 100%;
      padding: 11px 14px 11px 38px;
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(254, 44, 85, 0.4);
      border-radius: 12px;
      color: #fff;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .vault-search-box input:focus {
      border-color: #00f0ff;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.35);
    }

    .vault-search-box i {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #fe2c55;
    }

    .vault-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      margin-top: 14px;
    }
    @media (min-width: 480px) {
      .vault-grid { grid-template-columns: 1fr 1fr; }
    }

    .vault-card {
      background: rgba(14, 14, 20, 0.92);
      border: 1.5px solid rgba(254, 44, 85, 0.35);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.8);
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    .vault-card:hover {
      border-color: #00f0ff;
      transform: translateY(-3px);
      box-shadow: 0 12px 30px rgba(0, 240, 255, 0.3), 0 0 15px rgba(254, 44, 85, 0.4);
    }

    .vault-img-wrap {
      position: relative;
      width: 100%;
      height: 175px;
      background: #000;
      overflow: hidden;
      cursor: pointer;
    }

    .vault-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .vault-card:hover .vault-img {
      transform: scale(1.05);
    }

    .vault-tag {
      position: absolute;
      bottom: 8px;
      left: 8px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.6);
      color: #00f0ff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }

    .vault-price-badge {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #fcee0a;
      color: #fcee0a;
      font-size: 0.8rem;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(252, 238, 10, 0.4);
    }

    .vault-card-body {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(0, 0, 0, 0.4);
    }

    .vault-card-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .vault-code {
      font-family: 'Orbitron', monospace, sans-serif;
      font-size: 1.05rem;
      font-weight: 800;
      color: #fe2c55;
      letter-spacing: 0.5px;
      text-shadow: 0 0 8px rgba(254, 44, 85, 0.6);
    }

    .vault-price-display {
      font-size: 0.92rem;
      font-weight: 800;
      color: #fcee0a;
      text-shadow: 0 0 8px rgba(252, 238, 10, 0.5);
    }

    .btn-buy-acc {
      padding: 7px 14px;
      background: linear-gradient(135deg, #fe2c55, #ff0055);
      border: 1px solid #fe2c55;
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.82rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(254, 44, 85, 0.5);
      transition: all 0.2s ease;
    }

    .btn-buy-acc:hover {
      background: #fe2c55;
      box-shadow: 0 6px 20px rgba(254, 44, 85, 0.8), 0 0 10px #ffffff;
      transform: translateY(-1px);
    }

    .btn-copy-code {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #eee;
      font-size: 0.74rem;
      padding: 5px 8px;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: all 0.2s;
    }

    .btn-copy-code:hover {
      background: #fe2c55;
      border-color: #fe2c55;
      color: #fff;
    }

    .vault-loading {
      text-align: center;
      padding: 40px 10px;
      color: #aaa;
      font-size: 0.9rem;
    }

    .vault-empty {
      text-align: center;
      padding: 35px 10px;
      color: #777;
      font-size: 0.88rem;
    }

    /* MODAL PHÓNG TO ẢNH */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .modal-overlay.active {
      display: flex;
    }

    .image-modal-content {
      max-width: 95vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 10px;
      border: 1px solid rgba(254, 44, 85, 0.4);
      box-shadow: 0 0 30px rgba(0,0,0,0.9);
    }
    .image-modal-close {
      position: absolute;
      top: 16px;
      right: 20px;
      color: #fff;
      font-size: 32px;
      font-weight: bold;
      cursor: pointer;
    }
    .image-modal-close:hover {
      color: #fe2c55;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="nav-bar">
      <!-- Nút quay về trang bio chính -->
      <a href="index.html" class="btn-back-home">
        <i class="fa-solid fa-arrow-left"></i> Về Bio Profile
      </a>
      <span style="font-size: 0.82rem; color: #00f0ff; font-weight: 700;">
        <i class="fa-solid fa-shirt"></i> Kho áo của Chía 💗
      </span>
    </div>

    <div class="card-border-wrapper">
      <div class="card">
        <div style="text-align: center; margin-bottom: 16px;">
          <h2 style="font-size: 1.3rem; font-weight: 800; color: #00f0ff; text-shadow: 0 0 10px rgba(0,240,255,0.5);">
            <i class="fa-solid fa-shirt"></i> DANH SÁCH ACC CÓ SẴN
          </h2>
          <p style="font-size: 0.82rem; color: #bbb; margin-top: 4px;">
            Nhấn <strong>"MUA ACC NÀY"</strong> để sao chép mã và tự động chuyển sang TikTok nhắn cho tui nhé 💗
          </p>
        </div>

        <!-- Tìm kiếm mã acc -->
        <div class="vault-search-box">
          <i class="fa-solid fa-magnifying-glass"></i>
          <input type="text" id="vaultSearchInput" oninput="handleVaultSearch()" placeholder="Tìm kiếm theo mã tài khoản (#xxxxx)...">
        </div>

        <!-- Trạng thái tải -->
        <div id="vaultLoading" class="vault-loading">
          <i class="fa-solid fa-spinner fa-spin" style="font-size: 1.6rem; color: #fe2c55; margin-bottom: 8px;"></i>
          <p>Đang tải danh sách tài khoản...</p>
        </div>

        <!-- Danh sách thẻ acc -->
        <div id="vaultGrid" class="vault-grid" style="display: none;"></div>

        <!-- Trạng thái trống -->
        <div id="vaultEmpty" class="vault-empty" style="display: none;">
          <i class="fa-solid fa-box-open" style="font-size: 2rem; margin-bottom: 8px; color: #555;"></i>
          <p>Hiện chưa có tài khoản nào có sẵn trong kho!</p>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL XEM ẢNH LỚN -->
  <div id="imageModal" class="modal-overlay" onclick="closeImageModal()">
    <span class="image-modal-close">&times;</span>
    <img class="image-modal-content" id="modalImg" onclick="event.stopPropagation()">
  </div>

  <script>
    const SUPABASE_URL = 'https://llijmkoztqthovvklamm.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxsaWpta296dHF0aG92dmtsYW1tIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA4NDQ1NzksImV4cCI6MjEwNjQyMDU3OX0.6ZyBSLuXhQNC-nm1nCBTEZMs5Y3FDE83xD8lvL0HRUk';
    
    const { createClient } = supabase;
    const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let vaultAccounts = [];

    async function fetchVaultAccounts() {
      const loadingEl = document.getElementById('vaultLoading');
      const gridEl = document.getElementById('vaultGrid');
      const emptyEl = document.getElementById('vaultEmpty');

      loadingEl.style.display = 'block';
      gridEl.style.display = 'none';
      emptyEl.style.display = 'none';

      try {
        const { data, error } = await _supabase
          .from('accounts')
          .select('id, title, image, price, is_sold')
          .eq('is_sold', false)
          .order('created_at', { ascending: false });

        if (error) throw error;

        vaultAccounts = (data || []).map(row => ({
          id: row.id,
          title: row.title,
          image: row.image,
          price: row.price || 0
        }));

        loadingEl.style.display = 'none';
        renderVaultAccounts(vaultAccounts);
      } catch (err) {
        console.error("Lỗi:", err);
        loadingEl.innerHTML = `<p style="color:#fe2c55;">Không thể tải dữ liệu kho tài khoản!</p>`;
      }
    }

    function renderVaultAccounts(list) {
      const gridEl = document.getElementById('vaultGrid');
      const emptyEl = document.getElementById('vaultEmpty');
      gridEl.innerHTML = '';

      if (list.length === 0) {
        gridEl.style.display = 'none';
        emptyEl.style.display = 'block';
        return;
      }

      emptyEl.style.display = 'none';
      gridEl.style.display = 'grid';

      list.forEach(acc => {
        const card = document.createElement('div');
        card.className = 'vault-card';

        const priceNum = parseFloat(acc.price) || 0;
        const priceFormatted = priceNum > 0 ? priceNum.toLocaleString('vi-VN') + 'đ' : 'Liên hệ';

        const imgHtml = acc.image 
          ? `<div class="vault-img-wrap" onclick="openZoomImage('${acc.image}')">
               <img src="${acc.image}" alt="${acc.title}" class="vault-img" loading="lazy">
               <span class="vault-tag">VERIFIED</span>
               <span class="vault-price-badge">${priceFormatted}</span>
             </div>`
          : `<div class="vault-img-wrap" style="display:flex;align-items:center;justify-content:center;color:#666;font-size:0.8rem;">
               <i class="fa-solid fa-image" style="font-size:2rem;margin-bottom:4px;"></i>
               <span style="display:block;">Không có ảnh</span>
               <span class="vault-price-badge">${priceFormatted}</span>
             </div>`;

        card.innerHTML = `
          ${imgHtml}
          <div class="vault-card-body">
            <div class="vault-card-row">
              <span class="vault-code">${acc.title}</span>
              <span class="vault-price-display">${priceFormatted}</span>
            </div>
            <div class="vault-card-row">
              <button type="button" class="btn-copy-code" onclick="copyAccCode('${acc.title}', this)">
                <i class="fa-regular fa-copy"></i> Copy mã
              </button>
              <button type="button" class="btn-buy-acc" onclick="selectAndOrderAccount('${acc.title}', '${priceFormatted}')">
                <i class="fa-brands fa-tiktok"></i> MUA ACC NÀY
              </button>
            </div>
          </div>
        `;
        gridEl.appendChild(card);
      });
    }

    function handleVaultSearch() {
      const q = (document.getElementById('vaultSearchInput').value || '').trim().toLowerCase();
      const filtered = vaultAccounts.filter(acc => (acc.title || '').toLowerCase().includes(q));
      renderVaultAccounts(filtered);
    }

    function copyAccCode(code, btn) {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(code);
      } else {
        const ta = document.createElement('textarea');
        ta.value = code;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      const orig = btn.innerHTML;
      btn.innerHTML = `<i class="fa-solid fa-check"></i> Đã chép!`;
      setTimeout(() => { btn.innerHTML = orig; }, 2000);
    }

    function selectAndOrderAccount(accCode, accPrice) {
      const message = 
`🌸 YÊU CẦU MUA TÀI KHOẢN 🌸
- Mã tài khoản: ${accCode}
- Giá niêm yết: ${accPrice}
- Kênh liên hệ: Kho áo của Chía (@phalnnn)
---------------------------
👉 Mình muốn mua tài khoản ${accCode} giá ${accPrice} này, bạn kiểm tra và giao dịch giúp mình nhé 💗`;

      if (navigator.clipboard) {
        navigator.clipboard.writeText(message).then(() => {
          alert(`✨ Đã tự động sao chép mã tài khoản: ${accCode} (${accPrice})\n\nWeb sẽ chuyển sang TikTok @phalnnn ngay bây giờ, bạn chỉ cần Dán (Paste) tin nhắn gửi cho mình nhé 💗`);
          window.open('https://www.tiktok.com/@phalnnn', '_blank');
        }).catch(() => {
          prompt(`Hãy sao chép nội dung đơn mua tài khoản này:`, message);
          window.open('https://www.tiktok.com/@phalnnn', '_blank');
        });
      } else {
        prompt(`Hãy sao chép nội dung đơn mua tài khoản này:`, message);
        window.open('https://www.tiktok.com/@phalnnn', '_blank');
      }
    }

    function openZoomImage(src) {
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImg');
      modal.classList.add('active');
      modalImg.src = src;
    }

    function closeImageModal() {
      document.getElementById('imageModal').classList.remove('active');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === "Escape") closeImageModal();
    });

    window.addEventListener('DOMContentLoaded', fetchVaultAccounts);
  </script>
</body>
</html>
