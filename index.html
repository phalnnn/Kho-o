<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Kho áo của Chía 💗</title>
  <link rel="icon" href="avatar.jpg" type="image/jpeg">

  <link rel="preconnect" href="https://llijmkoztqthovvklamm.supabase.co" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 24px 12px 90px;
      background: linear-gradient(-45deg, #050507, #fe2c55, #121216, #ffffff, #000000);
      background-size: 400% 400%;
      animation: redWhiteBlackGradient 10s ease infinite;
      overflow-x: hidden;
      color: #ffffff;
    }

    @keyframes redWhiteBlackGradient {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Container co giãn thông minh cho Mobile & PC */
    .container {
      width: 100%;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: center;
      transition: max-width 0.3s ease;
    }

    @media (min-width: 768px) {
      .container { max-width: 860px; }
      body { padding: 32px 24px 80px; }
    }
    @media (min-width: 1100px) {
      .container { max-width: 1140px; }
    }

    .nav-bar {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card-border-wrapper {
      position: relative;
      width: 100%;
      border-radius: 28px;
      padding: 3px;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9),
                  0 0 25px rgba(254, 44, 85, 0.3),
                  0 0 15px rgba(255, 255, 255, 0.2);
    }

    .card-border-wrapper::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      background: conic-gradient(#fe2c55, #ffffff, #111111, #fe2c55);
      animation: spin 6s linear infinite;
      will-change: transform;
      z-index: 0;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .card {
      position: relative;
      width: 100%;
      background: linear-gradient(rgba(10, 10, 14, 0.88), rgba(10, 10, 14, 0.94)), 
                  url('bg-profile.jpg') center/cover no-repeat;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 26px;
      padding: 22px 16px;
      z-index: 1;
    }

    @media (min-width: 768px) {
      .card { padding: 30px 24px; }
    }

    /* Thanh tìm kiếm & bộ lọc */
    .controls-wrapper {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .vault-search-box {
      width: 100%;
      position: relative;
    }

    .vault-search-box input {
      width: 100%;
      padding: 12px 40px 12px 42px;
      background: rgba(0, 0, 0, 0.65);
      border: 1px solid rgba(254, 44, 85, 0.4);
      border-radius: 14px;
      color: #fff;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s;
    }

    .vault-search-box input:focus {
      border-color: #00f0ff;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.35);
    }

    .vault-search-box i.search-icon {
      position: absolute;
      left: 15px;
      top: 50%;
      transform: translateY(-50%);
      color: #fe2c55;
    }

    .search-clear-btn {
      display: none;
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255, 255, 255, 0.15);
      border: none;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      color: #ccc;
      font-size: 0.75rem;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    /* Chips lọc giá */
    .filter-chips {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .filter-chips::-webkit-scrollbar { display: none; }

    @media (min-width: 768px) {
      .filter-chips {
        justify-content: center;
        flex-wrap: wrap;
      }
    }

    .chip-btn {
      flex: 0 0 auto;
      padding: 7px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.16);
      color: #ddd;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .chip-btn.active {
      background: #fe2c55;
      border-color: #fe2c55;
      color: #fff;
      box-shadow: 0 0 10px rgba(254, 44, 85, 0.5);
    }

    /* Grid Layout đáp ứng cho Mobile -> Tablet -> PC */
    .vault-grid, .skeleton-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 480px) {
      .vault-grid, .skeleton-grid { grid-template-columns: repeat(2, 1fr); }
    }
    @media (min-width: 768px) {
      .vault-grid, .skeleton-grid { grid-template-columns: repeat(3, 1fr); gap: 18px; }
    }
    @media (min-width: 1024px) {
      .vault-grid, .skeleton-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; }
    }

      background: rgba(16, 16, 24, 0.95);
      border: 1.5px solid rgba(254, 44, 85,
